<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{第 NN 講：標題}}｜AI Agent 學習筆記</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>

  <!-- 1. 頁首導覽 -->
  <header class="site-header">
    <div class="wrap-wide">
      <a class="brand" href="../index.html">AI Agent 學習筆記</a>
      <nav><a href="../index.html">← 回首頁</a></nav>
    </div>
  </header>

  <main class="wrap">
    <!-- 2. 標題區 -->
    <section class="note-hero">
      <span class="badge">第 {{NN}} 講</span>
      <h1>{{標題}}</h1>
      <p class="lead">{{一句話摘要，30 字以內}}</p>
    </section>

    <!-- 3. 一句話重點 -->
    <p class="tldr">{{這堂課最重要的一個觀念}}</p>

    <!-- 4. 內文章節（2–5 個） -->
    <section class="note-section">
      <h2>{{章節標題}}</h2>
      <p>{{1–2 句說明這節在講什麼}}</p>
      <ul>
        <li>{{重點}}</li>
      </ul>

      <!-- 5. 重點框（每頁至少 1 個） -->
      <div class="callout">
        <span class="label">重點</span>
        <p class="formula">{{公式或定義}}</p>
      </div>
    </section>

    <!-- 6. 我的心得 -->
    <section class="reflection">
      <h2>我的心得</h2>
      <p>{{以第一人稱寫 2–4 句}}</p>
    </section>
  </main>

  <!-- 7. 頁尾 -->
  <footer class="site-footer">
    <div class="wrap">
      <a href="{{上一篇檔名}}">← 上一篇</a>
      <a href="{{下一篇檔名}}">下一篇 →</a>
    </div>
  </footer>

</body>
</html>
